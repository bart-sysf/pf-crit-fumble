# Critical Hit Cards - Pathfinder 1e
# Each entry needs: title, type (Bludgeoning|Piercing|Slashing|Bomb/Spell), effect

# --- Bludgeoning ---
- title: "Skull Crack"
  type: "Bludgeoning"
  effect: "Target is dazed for 1d4 rounds. DC 15 Fortitude save or be stunned for 1 round."

- title: "Bone Breaker"
  type: "Bludgeoning"
  effect: "Target takes normal damage and 1d4 Strength damage."

- title: "Rattling Blow"
  type: "Bludgeoning"
  effect: "Target is sickened for 1d6 rounds. No save."

- title: "Shattered Ribs"
  type: "Bludgeoning"
  effect: "Target is staggered for 2 rounds. DC 15 Fortitude save negates the staggered condition."

- title: "Kidney Blow"
  type: "Bludgeoning"
  effect: "Target is sickened for 1 minute and takes 1d4 Constitution damage. DC 15 Fortitude halves the ability damage."

- title: "Concussive Strike"
  type: "Bludgeoning"
  effect: "Target is confused for 1 round. DC 15 Will save negates."

- title: "Crippling Impact"
  type: "Bludgeoning"
  effect: "Target takes -2 on attack rolls and Dexterity-based checks for 1d4 rounds as a limb is badly bruised."

- title: "Pulverizing Smash"
  type: "Bludgeoning"
  effect: "Target is pushed back 5 feet and knocked prone. DC 15 Reflex save negates the prone condition."

# --- Piercing ---
- title: "Deep Puncture"
  type: "Piercing"
  effect: "Target bleeds for 1d6 damage per round for 3 rounds (DC 15 Heal to stop)."

- title: "Organ Strike"
  type: "Piercing"
  effect: "Target takes normal damage and 1d4 Constitution damage."

- title: "Pin Cushion"
  type: "Piercing"
  effect: "Weapon lodges in target. Target takes -2 penalty on attack rolls until removed (move action, DC 12 Heal)."

- title: "Vital Strike"
  type: "Piercing"
  effect: "The blow strikes a vital spot. Deal one additional weapon damage die on top of the critical hit damage."

- title: "Skewered Limb"
  type: "Piercing"
  effect: "Target's movement is halved and they take -2 on attack rolls for 1d4 rounds. DC 15 Fortitude save negates the movement penalty."

- title: "Hemorrhage"
  type: "Piercing"
  effect: "Target bleeds for 1d4 hit points per round. DC 15 Heal check or magical healing stops the bleeding."

- title: "Lung Puncture"
  type: "Piercing"
  effect: "Target must succeed at a DC 15 Fortitude save or become fatigued for 1d6 rounds."

- title: "Nerve Strike"
  type: "Piercing"
  effect: "A thrust pierces a nerve cluster. Target is paralyzed for 1 round. DC 15 Fortitude save negates."

# --- Slashing ---
- title: "Severed Tendon"
  type: "Slashing"
  effect: "Target's movement speed is halved until healed. DC 20 Heal check or magical healing to restore."

- title: "Gushing Wound"
  type: "Slashing"
  effect: "Target bleeds for 2d4 damage per round (DC 15 Heal to stop)."

- title: "Deep Gash"
  type: "Slashing"
  effect: "Target takes normal damage and is staggered for 1 round."

- title: "Ear Cleft"
  type: "Slashing"
  effect: "Target is deafened for 1d6 rounds. DC 15 Fortitude save negates."

- title: "Hamstring"
  type: "Slashing"
  effect: "Target is entangled (half move, -2 Dexterity) for 1d4 rounds. DC 15 Fortitude save negates."

- title: "Arterial Cut"
  type: "Slashing"
  effect: "Target bleeds for 1d6 hit points per round. DC 15 Heal check or magical healing stops the bleeding."

- title: "Crippling Slash"
  type: "Slashing"
  effect: "Target takes 1d4 Dexterity damage as muscles and sinew are severed."

- title: "Brutal Cleave"
  type: "Slashing"
  effect: "The strike rends armor as well as flesh. Target's armor bonus to AC is reduced by 1 (minimum 0) until repaired, and target is staggered for 1 round."

# --- Bomb/Spell ---
- title: "Arcane Feedback"
  type: "Bomb/Spell"
  effect: "Target must make a DC 15 Will save or lose their highest remaining spell slot."

- title: "Elemental Surge"
  type: "Bomb/Spell"
  effect: "Deal an additional 2d6 damage of the same energy type."

- title: "Reality Warp"
  type: "Bomb/Spell"
  effect: "Target is confused for 1d4 rounds. DC 15 Will save negates."

- title: "Arcane Explosion"
  type: "Bomb/Spell"
  effect: "The spell or bomb detonates with extra force. All creatures within 5 feet of the target take 1d6 splash damage of the same type (Reflex DC 15 half)."

- title: "Mind Shatter"
  type: "Bomb/Spell"
  effect: "Target must make a DC 15 Will save or be staggered for 1 round and take 1d4 Intelligence damage."

- title: "Spell Burn"
  type: "Bomb/Spell"
  effect: "Target catches fire, taking 1d6 fire damage per round for 1d4 rounds. DC 15 Reflex save each round to extinguish."

- title: "Gravity Well"
  type: "Bomb/Spell"
  effect: "Target is pulled 10 feet toward the caster and knocked prone. DC 15 Reflex save negates the movement."

- title: "Unstable Magic"
  type: "Bomb/Spell"
  effect: "Target is afflicted by a random minor curse for 1d4 rounds (d6: 1–2 -2 to all saves, 3–4 sickened, 5–6 blinded). DC 15 Will save negates."
