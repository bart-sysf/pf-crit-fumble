# Critical Hit Cards - Pathfinder 1e
# Each entry needs: title, type (Bludgeoning|Piercing|Slashing|Bomb/Spell), effect
# Balance note: your table uses crit multiplier reduced by x1 and then adds a card effect.
# Effects below are tuned to be roughly one extra damage roll plus a light rider.

# --- Bludgeoning ---
- title: "Skull Crack"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. Target is dazed for 1 round."

- title: "Bone Breaker"
  type: "Bludgeoning"
  effect: "Deal 1d8 damage. Target takes -1 to damage rolls until the end of its next turn."

- title: "Rattling Blow"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. Target is blinded for 1d6 rounds. DC 15 Fortitude negates."

- title: "Shattered Ribs"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. Target takes -10 feet movement speed for 1 round."

- title: "Kidney Blow"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. Target becomes fatigued for 1 round."

- title: "Concussive Strike"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. Target cannot take attacks of opportunity until the end of its next turn."

- title: "Crippling Impact"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. Target takes -2 on attack rolls until the end of its next turn."

- title: "Pulverizing Smash"
  type: "Bludgeoning"
  effect: "Deal 1d6 damage. You may push the target 5 feet."

# --- Piercing ---
- title: "Deep Puncture"
  type: "Piercing"
  effect: "Deal 1d6 damage. Target bleeds 2 hp per round for 3 rounds or until healed."

- title: "Organ Strike"
  type: "Piercing"
  effect: "Deal 1d8 damage. Target takes -1 on saves until the end of its next turn."

- title: "Pin Cushion"
  type: "Piercing"
  effect: "Deal 1d6 damage. Target takes -2 on its next attack roll."

- title: "Vital Strike"
  type: "Piercing"
  effect: "The blow finds a perfect gap. Roll two additional weapon damage dice."

- title: "Skewered Limb"
  type: "Piercing"
  effect: "Deal 1d6 damage. Target's movement speed is reduced by 10 feet for 1 round."

- title: "Hemorrhage"
  type: "Piercing"
  effect: "Deal 1d6 damage. Target bleeds 1 hp per round for 2 rounds or until healed."

- title: "Lung Puncture"
  type: "Piercing"
  effect: "Deal 1d6 damage. Target cannot run or charge until the end of its next turn."

- title: "Nerve Strike"
  type: "Piercing"
  effect: "Deal 1d6 damage. Target takes -2 to Dexterity-based checks until the end of its next turn."

# --- Slashing ---
- title: "Severed Tendon"
  type: "Slashing"
  effect: "Deal 1d6 damage. Target's movement speed is reduced by 10 feet for 1 round."

- title: "Gushing Wound"
  type: "Slashing"
  effect: "Deal 1d6 damage. Target bleeds 1 hp per round for 3 rounds or until healed."

- title: "Deep Gash"
  type: "Slashing"
  effect: "Deal 1d8 damage. Target takes -1 AC until the end of its next turn."

- title: "Ear Cleft"
  type: "Slashing"
  effect: "Deal 1d6 damage. Target is deafened for 1 round."

- title: "Hamstring"
  type: "Slashing"
  effect: "Deal 1d6 damage. Target is entangled until the end of its next turn (Reflex DC 15 negates)."

- title: "Arterial Cut"
  type: "Slashing"
  effect: "Deal 1d6 damage. Target bleeds 1 hp per round for 4 rounds or until healed."

- title: "Crippling Slash"
  type: "Slashing"
  effect: "Deal 1d6 damage. Target takes -2 on Acrobatics checks and CMD until the end of its next turn."

- title: "Brutal Cleave"
  type: "Slashing"
  effect: "Deal 1d8 damage. If the target is adjacent to an ally of yours, that ally gains +1 on its next attack against this target before the end of its next turn."

# --- Bomb/Spell ---
- title: "Arcane Feedback"
  type: "Bomb/Spell"
  effect: "Deal 1d8 damage of the same energy type. Target takes -2 on concentration checks until the end of its next turn."

- title: "Elemental Surge"
  type: "Bomb/Spell"
  effect: "Deal 1d10 damage of the same energy type."

- title: "Reality Warp"
  type: "Bomb/Spell"
  effect: "Deal 1d6 force damage. Target is dazzled for 1 round."

- title: "Arcane Explosion"
  type: "Bomb/Spell"
  effect: "Deal 1d6 damage to the target. One creature adjacent to the target takes 1d4 splash damage of the same type (Reflex DC 15 negates)."

- title: "Mind Shatter"
  type: "Bomb/Spell"
  effect: "Deal 1d6 damage. Target takes -2 on Will saves until the end of its next turn."

- title: "Spell Burn"
  type: "Bomb/Spell"
  effect: "Deal 1d6 fire damage. Target takes 1d4 fire damage at the start of its next turn (Reflex DC 15 negates)."

- title: "Gravity Well"
  type: "Bomb/Spell"
  effect: "Deal 1d6 force damage. You may pull the target 5 feet toward you."

- title: "Unstable Magic"
  type: "Bomb/Spell"
  effect: "Deal 1d6 damage. Roll 1d3: 1 dazzled, 2 shaken, 3 -10 feet speed, each until end of target's next turn."

# --- Ranged ---
- title: "Pinning Shot"
  type: "Ranged"
  effect: "Deal 1d6 damage. Target's movement speed is reduced by 10 feet until the end of its next turn."

- title: "Vital Strike"
  type: "Ranged"
  effect: "You hit a critical weak point. Roll two additional weapon damage dice."
  
- title: "Disarming Shot"
  type: "Ranged"
  effect: "Deal 1d6 damage. Target takes -2 on its next attack roll."
  
- title: "Through-and-Through"
  type: "Ranged"
  effect: "Deal 1d6 damage. If another enemy is directly behind the target and within your first range increment, that enemy takes 1d6 damage."
  
- title: "Arrow to the knee"
  type: "Ranged"
  effect: "You strike your enemy's knee. Target's movement speed is halved for 1d4 rounds."
