# Fumble Cards - Pathfinder 1e
# Each entry needs: title, type (Bludgeoning|Piercing|Slashing|Bomb/Spell), effect
# Balance note: fumbles apply a small tactical setback, not a major shutdown.

# --- Bludgeoning ---
- title: "Wild Swing"
  type: "Bludgeoning"
  effect: "You overextend. The target gains +2 AC against your next attack before the end of your next turn."

- title: "Numbed Hands"
  type: "Bludgeoning"
  effect: "The impact jars your hands. You take -2 on your next attack roll."

- title: "Off Balance"
  type: "Bludgeoning"
  effect: "You stumble. You take -1 AC until the start of your next turn."

- title: "Shoulder Strain"
  type: "Bludgeoning"
  effect: "You wrench your shoulder. Take 1d4 nonlethal damage and -1 on attack rolls until the end of your next turn."

- title: "Stumble Forward"
  type: "Bludgeoning"
  effect: "You lose your footing on the follow-through. You cannot take a 5-foot step until your next turn."

- title: "Gear Slip"
  type: "Bludgeoning"
  effect: "Your armor or shield shifts. Take -1 AC until the start of your next turn."

- title: "Telegraphed Strike"
  type: "Bludgeoning"
  effect: "Your swing telegraphs so clearly that your target gains a +2 dodge bonus to AC against your next attack."

- title: "Overswing"
  type: "Bludgeoning"
  effect: "You spin from the force of your swing. Any remaining attacks you make this turn are at -2."

# --- Piercing ---
- title: "Stuck Weapon"
  type: "Piercing"
  effect: "Your weapon catches on armor or terrain. You take -2 on your next attack roll."

- title: "Overcommit"
  type: "Piercing"
  effect: "You lunge too far. You take -1 AC until the start of your next turn."

- title: "Bent Point"
  type: "Piercing"
  effect: "Your thrust lands poorly. Your next successful piercing hit deals -2 damage."

- title: "Fumbled Grip"
  type: "Piercing"
  effect: "Your weapon rotates in your hand. You are at -2 on your next attack roll."

- title: "Lunged Too Far"
  type: "Piercing"
  effect: "You are off balance from the thrust. You cannot make attacks of opportunity until the start of your next turn."

- title: "Pierced Nothing"
  type: "Piercing"
  effect: "Your thrust meets only air. Your movement speed is reduced by 10 feet until the end of your next turn."

- title: "Skid and Slide"
  type: "Piercing"
  effect: "You slip as you thrust. Make a DC 10 Reflex save or take -2 AC until the start of your next turn."

- title: "Missed Vitals"
  type: "Piercing"
  effect: "Your weapon strikes at an awkward angle. Your next attack deals minimum weapon damage (before modifiers)."

# --- Slashing ---
- title: "Self Inflicted"
  type: "Slashing"
  effect: "You nick yourself. Take 1 damage."

- title: "Broken Grip"
  type: "Slashing"
  effect: "Your grip loosens. You take -2 on your next attack roll."

- title: "Tangled Swing"
  type: "Slashing"
  effect: "Your swing tangles your stance. You cannot make attacks of opportunity until the start of your next turn."

- title: "Blade Bounce"
  type: "Slashing"
  effect: "Your blade bounces wide. Your next successful hit deals -2 damage."

- title: "Unbalanced Stance"
  type: "Slashing"
  effect: "You are off balance. Adjacent enemies gain +1 on attack rolls against you until the start of your next turn."

- title: "Weapon Snagged"
  type: "Slashing"
  effect: "Your blade snags briefly. You take -2 on your next attack roll unless you spend a move action to reset your stance."

- title: "Slipped Footing"
  type: "Slashing"
  effect: "You slip on the follow-through. Make a DC 12 Acrobatics check or take -1 AC until the start of your next turn."

- title: "Deep Nick"
  type: "Slashing"
  effect: "You misjudge the swing and cut yourself. Take 1d4 damage."

# --- Bomb/Spell ---
- title: "Spell Fizzle"
  type: "Bomb/Spell"
  effect: "The spell or bomb fizzles. The effect is lost, but no additional penalty applies."

- title: "Arcane Backlash"
  type: "Bomb/Spell"
  effect: "Magical energy feeds back into you. Take 1d4 force damage and -1 on concentration checks until end of your next turn."

- title: "Wild Magic"
  type: "Bomb/Spell"
  effect: "The spell sputters wildly. Your next Bomb/Spell attack before end of next turn takes -2 to hit."

- title: "Misfire"
  type: "Bomb/Spell"
  effect: "The effect detonates early. You take 1d4 damage of the spell or bomb type."

- title: "Magical Drain"
  type: "Bomb/Spell"
  effect: "The spell's energy drains your focus. You take -1 on concentration checks for 1 round."

- title: "Volatile Discharge"
  type: "Bomb/Spell"
  effect: "Excess energy lashes out. One adjacent creature of your choice takes 1 damage of the same type (or you take it if no one is adjacent)."

- title: "Burnout"
  type: "Bomb/Spell"
  effect: "The failed casting tires you. You are fatigued until the end of your next turn."

- title: "Feedback Loop"
  type: "Bomb/Spell"
  effect: "The spell's energy loops back through you. Take 1d4 nonlethal damage and cannot make attacks of opportunity until your next turn."

# --- Ranged ---
- title: "Wild Shot"
  type: "Ranged"
  effect: "Your aim goes wide. You take -2 on your next ranged attack roll."

- title: "String Snap / Misfire"
  type: "Ranged"
  effect: "Your weapon malfunctions. Spend a move action before your next ranged attack or that attack takes -4."
  
- title: "Overextended Aim"
  type: "Ranged"
  effect: "You lose your stance trying to line up the shot. You take -1 AC until the start of your next turn."
  
- title: "Self-Obstruction"
  type: "Ranged"
  effect: "Something gets in your way at the worst moment. -2 penalty to your next attack."
