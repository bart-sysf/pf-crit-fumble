server {
    listen 8080;
    server_name _;

    # Prevent nginx from appending the listen port to redirects
    absolute_redirect off;

    # Security Headers
    # Traefik will handle HTTPS, so we add HSTS for browsers to remember
    # Note: includeSubDomains is disabled because different subdomains may serve different purposes
    add_header Strict-Transport-Security "max-age=31536000; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # remove trailing slash
    rewrite ^/(.*)/$ /$1 permanent;

    root /usr/share/nginx/html;
    charset utf-8;
    autoindex off;
    index index.html;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|ttf|woff2|eot|json|txt)$ {
        expires max;
        add_header Cache-Control public;
        add_header Access-Control-Allow-Origin *;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}