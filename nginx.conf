# Map X-Forwarded-Host to X-Robots-Tag value so non-canonical domains are not indexed
map $http_x_forwarded_host $x_robots_tag {
    "sysf.nl"   "index, follow";
    default     "noindex, nofollow";
}

server {
    listen 8080;
    server_name _;

    # Prevent nginx from appending the listen port to redirects
    absolute_redirect off;

    # Security Headers
    # Traefik will handle HTTPS, so we add HSTS for browsers to remember
    # Note: includeSubDomains is disabled because different subdomains may serve different purposes
    add_header Strict-Transport-Security "max-age=31536000; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $x_robots_tag always;

    # Redirect www to apex domain (Traefik sets X-Forwarded-Host)
    if ($http_x_forwarded_host = "www.sysf.nl") {
        return 301 https://sysf.nl$request_uri;
    }

    # remove trailing slash
    rewrite ^/(.*)/$ /$1 permanent;

    root /usr/share/nginx/html;
    charset utf-8;
    autoindex off;
    index index.html;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|ttf|woff2|eot|json|txt)$ {
        expires max;
        add_header Cache-Control public;
        add_header Access-Control-Allow-Origin *;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}